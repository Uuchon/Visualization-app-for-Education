<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f9f9f6">
<title>WAVE LAB — スマホ版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="m.css">
</head>
<body>
<header class="bar">
  <div class="brand">WAVE LAB<small>SOUND → COLOUR</small></div>
  <a class="pc" href="./?pc=1">PC版 ↗</a>
</header>

<div class="layout">
  <!-- 左（縦持ちでは上）: 色の円・音名・音程のずれ・ボタン -->
  <section class="stage" aria-label="いまの音の色">
    <div class="orbwrap"><div id="orb" role="img" aria-label="音の色の円"></div></div>
    <div class="note"><span id="noteName">—</span><span id="noteSub">音を出してみよう</span></div>
    <div class="gauge" aria-label="音程のずれ">
      <div class="gtrack"><i class="tick"></i><div id="needle"></div></div>
      <div class="glabels"><span>低い</span><span id="centsTxt">±0 cent</span><span>高い</span></div>
    </div>
    <div class="actions">
      <button class="btn" id="btnMic">マイク</button>
      <button class="btn" id="btnTone">テスト音</button>
      <button class="btn" id="btnFile">ファイル</button>
      <input type="file" id="fileIn" accept="audio/*,.wav,.mp3,.m4a,.ogg,.flac,.aac" hidden>
    </div>
    <p class="msg" id="msg" role="status"></p>
  </section>

  <!-- 右（縦持ちでは下）: 色の決めかた・数値・スペクトル -->
  <section class="side" aria-label="くわしい数値">
    <div class="card">
      <label class="lbl" for="mapSel">色の決めかた</label>
      <select id="mapSel">
        <option value="audible">全体の音（低い=赤 → 高い=紫）</option>
        <option value="scale">音階（ドレミ→色相環）</option>
        <option value="whistle">笛の音（500〜2500 Hz）</option>
        <option value="voice">声の高さ（80〜500 Hz）</option>
      </select>
      <div class="strip" id="strip"><i id="stripMark"></i></div>
      <div class="stripl"><span id="stripL"></span><span id="stripR"></span></div>
    </div>

    <div class="card grid" id="metrics">
      <div><span>基本周波数 F0</span><b id="mF0">—</b></div>
      <div><span>スペクトル重心</span><b id="mCent">—</b></div>
      <div><span>耳の感度補正後</span><b id="mPhon">—</b></div>
      <div><span>純音らしさ</span><b id="mFlat">—</b></div>
      <div><span>色相 H</span><b id="mH">—</b></div>
      <div><span>彩度 S</span><b id="mS">—</b></div>
      <div><span>明度 B</span><b id="mB">—</b></div>
      <div><span>入力レベル</span><b id="mLv">—</b></div>
    </div>

    <div class="card">
      <div class="lbl">FFTスペクトル（対数周波数）</div>
      <canvas id="fftCv" height="120"></canvas>
      <div class="axis"><span>20</span><span>100</span><span>1k</span><span>10k</span><span>Hz</span></div>
    </div>

    <div class="card">
      <label class="lbl" for="sens">感度（色が暗い・うすいとき）<b id="sensV"></b></label>
      <input type="range" id="sens" min="60" max="130" step="1" value="100">
      <p class="hint">大きい声を出しても色が暗いときは右へ、すぐ明るくなりすぎるときは左へ。</p>
    </div>
  </section>
</div>

<script src="m.js"></script>
</body>
</html>
